server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate: every visit checks the server (ETag) and gets the new
  # version the moment it is deployed. Cheap for a static site.
  add_header Cache-Control "no-cache, must-revalidate" always;
  etag on;

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/json;

  location / {
    try_files $uri $uri/ =404;
  }
}
